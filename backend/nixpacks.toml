# Configuración de Nixpacks para Railway.
# En Railway, el "Root Directory" del servicio debe ser /backend.
#
# El build corre `prisma generate && tsc` y, al terminar, npm dispara el script
# `postbuild` (`prisma migrate deploy`), que crea las tablas en Neon antes de
# que el contenedor arranque.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

# --include=dev: prisma y typescript son devDependencies y los necesita el
# build. Con NODE_ENV=production en las variables del servicio, npm las
# omitiría y `prisma generate` / `tsc` no existirían.
[phases.install]
cmds = ["npm ci --include=dev || npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
