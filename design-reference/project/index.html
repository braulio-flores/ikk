<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IKK Solutions — Sistema visual & pantallas</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: #efece6;
      font-family: 'Geist', system-ui, sans-serif;
      color: #1a1a1a;
    }
    @keyframes ikkspin { to { transform: rotate(360deg); } }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="brand.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="panel.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent_hue": 260,
      "landing_personality": "product",
      "landing_theme": "dark",
      "show_brand": true,
      "show_components": true,
      "show_public": true,
      "show_private": true
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = window.useTweaks(DEFAULTS);

      // Apply accent hue to the root so all CSS vars cascade.
      useEffect(() => {
        document.documentElement.style.setProperty('--ikk-accent-h', tweaks.accent_hue);
      }, [tweaks.accent_hue]);

      const landingThemeClass = tweaks.landing_theme === 'light' ? 'ikk-light' : '';

      return (
        <>
          <DesignCanvas title="IKK Solutions" subtitle="Identidad visual + landing + panel privado — un solo sistema, dos caras">

            {tweaks.show_brand && (
              <DCSection id="marca" title="Marca" subtitle="Logo, paleta y tipografía — base del sistema">
                <DCArtboard id="logo"    label="Logo · símbolo y wordmark"  width={760} height={620}><BrandLogoArtboard /></DCArtboard>
                <DCArtboard id="palette" label="Paleta de color"            width={760} height={580}><BrandPaletteArtboard /></DCArtboard>
                <DCArtboard id="type"    label="Tipografía"                 width={900} height={620}><BrandTypeArtboard /></DCArtboard>
              </DCSection>
            )}

            {tweaks.show_components && (
              <DCSection id="sistema" title="Componentes" subtitle="Buttons, inputs, badges, KPI, toast — base shadcn-friendly">
                <DCArtboard id="components" label="UI Kit · core"           width={1100} height={760}><ComponentsArtboard /></DCArtboard>
              </DCSection>
            )}

            {tweaks.show_public && (
              <DCSection id="publico" title="Pública" subtitle="La cara de IKK Solutions. Sin enlaces visibles al panel.">
                <DCArtboard id="landing-desktop" label="Landing · desktop 1280" width={1280} height={2700}>
                  <div className={landingThemeClass} style={{ height: '100%', overflow: 'auto' }}>
                    <Landing personality={tweaks.landing_personality} width={1280} />
                  </div>
                </DCArtboard>
                <DCArtboard id="landing-mobile" label="Landing · móvil 390" width={390} height={1300}>
                  <div className={landingThemeClass} style={{ height: '100%', overflow: 'auto' }}>
                    <LandingMobile personality={tweaks.landing_personality} />
                  </div>
                </DCArtboard>
              </DCSection>
            )}

            {tweaks.show_private && (
              <DCSection id="privado" title="Privada — panel master" subtitle="Acceso solo por URL. Sin entradas desde la landing.">
                <DCArtboard id="login"     label="/login · idle"           width={1280} height={800}><LoginScreen width={1280} height={800} state="idle" /></DCArtboard>
                <DCArtboard id="login-err" label="/login · error"          width={1280} height={800}><LoginScreen width={1280} height={800} state="error" /></DCArtboard>
                <DCArtboard id="overview"  label="Overview"                width={1440} height={900}><PanelOverview width={1440} height={900} /></DCArtboard>
                <DCArtboard id="empresas"  label="Tickomium / Empresas"    width={1440} height={900}><TickomiumEmpresas width={1440} height={900} /></DCArtboard>
                <DCArtboard id="empresas-drawer" label="Tickomium / Empresas — drawer" width={1440} height={900}><TickomiumEmpresas width={1440} height={900} drawerOpen /></DCArtboard>
              </DCSection>
            )}

          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Marca">
              <TweakRadio
                label="Color acento"
                value={String(tweaks.accent_hue)}
                onChange={(v) => setTweak('accent_hue', Number(v))}
                options={[
                  { value: '260', label: 'Cobalto' },
                  { value: '300', label: 'Violeta' },
                  { value: '135', label: 'Lima' },
                ]}
              />
            </TweakSection>

            <TweakSection label="Landing">
              <TweakSelect
                label="Personalidad"
                value={tweaks.landing_personality}
                onChange={(v) => setTweak('landing_personality', v)}
                options={[
                  { value: 'sober',    label: 'Sobria (Linear/Vercel)' },
                  { value: 'terminal', label: 'Sobria + terminal' },
                  { value: 'product',  label: 'Sobria + producto' },
                ]}
              />
              <TweakRadio
                label="Tema landing"
                value={tweaks.landing_theme}
                onChange={(v) => setTweak('landing_theme', v)}
                options={[
                  { value: 'dark',  label: 'Oscuro' },
                  { value: 'light', label: 'Claro' },
                ]}
              />
            </TweakSection>

            <TweakSection label="Secciones visibles">
              <TweakToggle label="Marca"        value={tweaks.show_brand}      onChange={(v) => setTweak('show_brand', v)} />
              <TweakToggle label="Componentes"  value={tweaks.show_components} onChange={(v) => setTweak('show_components', v)} />
              <TweakToggle label="Pública"      value={tweaks.show_public}     onChange={(v) => setTweak('show_public', v)} />
              <TweakToggle label="Privada"      value={tweaks.show_private}    onChange={(v) => setTweak('show_private', v)} />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
