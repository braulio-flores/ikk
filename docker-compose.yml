version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: ikk-db
    restart: always
    # 5433 en el host para no chocar con Tickomium (5432). Adentro del
    # contenedor sigue siendo 5432.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ikk
      POSTGRES_PASSWORD: ikk
      POSTGRES_DB: ikk_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
